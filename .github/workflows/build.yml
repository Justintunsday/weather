name: Build rootless deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid dpkg xz

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Fetch iPhoneOS 16.5 SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk "$HOME/theos/sdks/"

      - name: Build package
        run: make package FINALPACKAGE=1

      - name: Inspect package
        run: |
          ls -lh packages
          for f in packages/*.deb; do
            echo "== $f =="
            dpkg-deb -I "$f"
            dpkg-deb -c "$f" | head -60
          done

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: WeatherSource-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
