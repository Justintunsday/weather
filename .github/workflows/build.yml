name: Build rootless deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid dpkg xz

      - name: Test JSON response patching
        run: |
          xcrun clang++ -fobjc-arc -framework Foundation -Isrc tests/ResponsePatcherTests.mm src/WSWeatherResponsePatcher.mm src/WSWeatherModel.m src/WSCondition.m src/WSSettings.m -o /tmp/weather-response-tests
          /tmp/weather-response-tests

      - name: Test HKO provider and response integration
        run: |
          xcrun clang++ -fobjc-arc -Wno-nullability-completeness -framework Foundation -Isrc tests/HKOProviderTests.mm src/WSHKOProvider.m src/WSWeatherResponsePatcher.mm src/WSWeatherModel.m src/WSCondition.m src/WSSettings.m src/WSProviderRegistry.m src/WSRegionResolver.m src/WSOpenMeteoProvider.m src/WSQWeatherProvider.m -o /tmp/weather-hko-tests
          /tmp/weather-hko-tests

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          ln -sfn "$SDK_PATH" "$HOME/theos/sdks/$(basename "$SDK_PATH")"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "Using SDK: $SDK_PATH"

      - name: Build package
        run: make package FINALPACKAGE=1

      - name: Inspect package
        run: |
          ls -lh packages
          for f in packages/*.deb; do
            echo "== $f =="
            dpkg-deb -I "$f"
            dpkg-deb -c "$f" | head -60
          done

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: WeatherSource-rootless-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Build signed HKO device probe
        run: |
          mkdir -p device-tools
          xcrun --sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=16.0 -fobjc-arc -Wno-nullability-completeness -framework Foundation -Isrc tools/HKODeviceProbe.mm src/*.m src/*.mm -o device-tools/hko-device-probe
          ldid -S device-tools/hko-device-probe

      - name: Upload device probe
        uses: actions/upload-artifact@v4
        with:
          name: WeatherSource-device-tools
          path: device-tools/hko-device-probe
          if-no-files-found: error
