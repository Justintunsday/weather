name: Build rootless deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid dpkg xz

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          ln -sfn "$SDK_PATH" "$HOME/theos/sdks/$(basename "$SDK_PATH")"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "Using SDK: $SDK_PATH"

      - name: Build package
        run: make package FINALPACKAGE=1

      - name: Inspect package
        run: |
          ls -lh packages
          for f in packages/*.deb; do
            echo "== $f =="
            dpkg-deb -I "$f"
            dpkg-deb -c "$f" | head -60
          done

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: WeatherSource-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
